name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (headless OpenCV, no display available on CI)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml pyserial matplotlib
          pip install -r requirements-dev.txt

      - name: Run standalone test suite
        run: python test_standalone.py

      - name: Upload annotated test frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball-test-output-py${{ matrix.python-version }}
          path: /tmp/ball_test_output.png
          if-no-files-found: ignore
